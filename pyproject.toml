[project]
name = "saimoo"
version = "0.1.0"
description = "A Quant Investment Tool for China A-Shares"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "akshare>=1.18.23",
    "click>=8.3.1",
    "loguru>=0.7.3",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "sqlalchemy>=2.0.46",
    "tushare>=1.4.24",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.5.4",
    "pytest>=9.0.2",
    "ruff>=0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saimoo"]
